watchers:
  - name: webhook_events
    source: webhook
    webhook_log_path: /root/.openclaw/workspace/webhook_events.jsonl
    batch_count: 50
    filter:
      field: "payload.type"
      op: "!="
      value: "sunny"
    wake:
      method: sessions_send
      session_key: "agent:main:slack:channel:YOURCHANNEL"
      message_template: |
        Webhook event: id={{event_id}} type={{payload.type}} city={{payload.city}}
